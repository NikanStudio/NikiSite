<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NikiSite | نیکی سایت</title>

    <meta name="description"
          content="به NikiSite خوش آمدید؛ یک سایت سرگرم‌کننده و جذاب.">

    <meta name="keywords"
          content="NikiSite, Niki Site, نیکی سایت">

    <meta name="author" content="NikiSite">

    <meta name="robots" content="index, follow">

    <link rel="canonical"
          href="https://nikanstudio.github.io/NikiSite/">

    <!-- Open Graph -->
    <meta property="og:title"
          content="NikiSite | نیکی سایت">

    <meta property="og:description"
          content="به NikiSite خوش آمدید؛ یک سایت سرگرم‌کننده و جذاب.">

    <meta property="og:url"
          content="https://nikanstudio.github.io/NikiSite/">

    <meta property="og:type"
          content="website">

    <link rel="sitemap"
          type="application/xml"
          href="https://nikanstudio.github.io/NikiSite/sitemap.xml">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f4f9ff;
            color: #222;
            line-height: 1.8;
        }

        header {
            background: #2196f3;
            color: white;
            padding: 30px 15px;
            text-align: center;
        }

        header h1 {
            font-size: 34px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 16px;
        }

        nav {
            background: white;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        nav a {
            display: inline-block;
            margin: 5px 12px;
            color: #1976d2;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #0d47a1;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        section {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        section h2 {
            color: #1976d2;
            margin-bottom: 12px;
        }

        .game {
            text-align: center;
        }

        .game button {
            border: none;
            background: #2196f3;
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        .game button:hover {
            background: #1976d2;
        }

        #score {
            margin-top: 15px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            background: #1976d2;
            color: white;
            padding: 20px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>NikiSite</h1>
    <p>به نیکی سایت خوش آمدید 🌐</p>
</header>

<nav>
    <a href="#about">درباره NikiSite</a>
    <a href="#game">بازی</a>
</nav>

<main>

    <section id="about">
        <h2>درباره NikiSite</h2>

        <p>
            به NikiSite خوش آمدید!
            این سایت برای سرگرمی و ارائه بخش‌های مختلف ساخته شده است.
        </p>
    </section>

    <section id="game" class="game">
        <h2>🎮 بازی ساده</h2>

        <p>
            روی دکمه کلیک کن و امتیاز بگیر!
        </p>

        <button onclick="increaseScore()">
            کلیک کن!
        </button>

        <div id="score">
            امتیاز: 0
        </div>
    </section>

</main>

<footer>
    © 2026 NikiSite
</footer>

<script>
    let score = 0;

    function increaseScore() {
        score++;

        document.getElementById("score").textContent =
            "امتیاز: " + score;
    }
</script>

</body>
</html>
